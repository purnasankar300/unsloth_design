name: selvedge

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: selvedge
      POSTGRES_USER: selvedge
      POSTGRES_PASSWORD: selvedge_dev
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selvedge -d selvedge"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stands in for Cloudflare R2 in development. R2 is S3-compatible, so the
  # application code and signed-URL behaviour are identical; only env differs.
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: selvedge
      MINIO_ROOT_PASSWORD: selvedge_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the private bucket. Never sets a public policy — the
  # bucket must stay private and be read only through signed URLs.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 selvedge selvedge_dev_secret &&
      mc mb --ignore-existing local/selvedge-designs &&
      mc anonymous set none local/selvedge-designs &&
      echo 'bucket ready (private)'
      "

volumes:
  pgdata:
  miniodata:
